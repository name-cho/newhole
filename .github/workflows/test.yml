name: test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: ['**']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.21.x', '1.22.x', '1.23.x']
        os: [ubuntu-latest, macos-latest, windows-latest]
        tags: [cli, desktop]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install GTK and WebKit (Linux, desktop only)
        if: matrix.os == 'ubuntu-latest' && matrix.tags == 'desktop'
        run: sudo apt-get update && sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Unit tests
        run: go test -tags ${{ matrix.tags }} ./...

      - name: Vet
        run: go vet -tags ${{ matrix.tags }} ./...
